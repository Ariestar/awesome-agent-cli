name: secretlint
binary: secretlint
aliases: []
category:
- security
- lint
lang:
- all
summary: Pluggable credential and secret scanner preventing committed credentials
  in repos.
homepage: https://github.com/secretlint/secretlint
docs: https://github.com/secretlint/secretlint#readme
detect:
  version_args:
  - --version
  local:
    files:
    - .secretlintrc.json
use_when:
- Validating files and staged diffs for private keys and tokens before committing
avoid_when:
- Formatting general code indentation
risk:
  level: low
  effects:
  - read_files
  requires_auth: false
  destructive: false
  confirmation_required_for: []
