name: browserbase
binary: browserbase
aliases: []
category:
- agent
- cloud
lang:
- all
summary: Cloud browser infrastructure CLI for scaling agent web browsing sessions.
homepage: https://browserbase.com
docs: https://docs.browserbase.com
detect:
  version_args:
  - --version
use_when:
- Running large-scale concurrent browser sessions for AI agents in cloud sandboxes
  with proxy support
avoid_when:
- Testing locally with a visible browser window
risk:
  level: medium
  effects:
  - network_access
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - running large browser session fleets
