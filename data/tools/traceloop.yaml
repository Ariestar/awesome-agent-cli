name: traceloop
binary: traceloop
aliases: []
category:
- debug
- metrics
lang:
- all
summary: OpenLLMetry CLI for instrumenting agent tool calls with OpenTelemetry standards.
homepage: https://github.com/traceloop/openllmetry
docs: https://www.traceloop.com/docs
detect:
  version_args:
  - --version
use_when:
- Exporting agent traces to standard APM platforms like Datadog, Honeycomb, or Dynatrace
avoid_when:
- Zero-dependency standalone tools
risk:
  level: low
  effects:
  - network_access
  requires_auth: true
  destructive: false
  confirmation_required_for: []
