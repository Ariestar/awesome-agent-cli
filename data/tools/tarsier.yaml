name: tarsier
binary: tarsier
aliases: []
category:
- agent
- agent-context
lang:
- python
summary: Visual perception CLI converting web and terminal screens into text and OCR
  representations for LLMs.
homepage: https://github.com/reworkd/tarsier
docs: https://github.com/reworkd/tarsier#readme
detect:
  version_args:
  - --version
use_when:
- Bridging visual browser pages to text-only LLMs using numbered coordinate overlays
avoid_when:
- Direct DOM access is already available via accessibility tree
risk:
  level: low
  effects:
  - read_files
  requires_auth: false
  destructive: false
  confirmation_required_for: []
