name: crane
binary: crane
aliases: []
category:
- container
lang:
- all
summary: Fast Go CLI for interacting directly with remote container registries without
  a daemon.
homepage: https://github.com/google/go-containerregistry
docs: https://github.com/google/go-containerregistry/blob/main/cmd/crane/README.md
detect:
  version_args:
  - version
use_when:
- Manipulating container manifests, digest tags, and catalogs quickly in registry
  endpoints
avoid_when:
- Running live local container instances
risk:
  level: medium
  effects:
  - network_access
  - remote_write
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - deleting remote image tags
