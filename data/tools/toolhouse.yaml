name: toolhouse
binary: toolhouse
aliases: []
category:
- agent
- mcp
lang:
- all
summary: Tool runtime and CLI for injecting real-world actions into agent models.
homepage: https://toolhouse.ai
docs: https://docs.toolhouse.ai
detect:
  version_args:
  - --version
use_when:
- Providing agents with plug-and-play cloud execution capabilities without custom
  integration code
avoid_when:
- Private networks blocking external tool cloud endpoints
risk:
  level: high
  effects:
  - execute_code
  - network_access
  - remote_write
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - executing cloud tool integrations
guardrails:
- Verify target parameters before dispatching third-party tool requests.
