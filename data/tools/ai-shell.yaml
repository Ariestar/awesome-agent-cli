name: ai-shell
binary: ai
aliases: []
category:
- agent
- shell
lang:
- all
summary: BuilderIO CLI utility translating natural language into terminal commands.
homepage: https://github.com/BuilderIO/ai-shell
docs: https://github.com/BuilderIO/ai-shell#readme
detect:
  version_args:
  - --version
use_when:
- Translating plain English descriptions into complex shell commands
avoid_when:
- Writing multi-file source code or application logic
risk:
  level: high
  effects:
  - execute_code
  - network_access
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - executing suggested shell commands
guardrails:
- Verify commands before allowing automated execution.
