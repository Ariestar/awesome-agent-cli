name: localtunnel
binary: localtunnel
aliases: []
category:
- network
lang:
- all
summary: Lightweight command-line utility exposing localhost to the web for quick
  testing.
homepage: https://github.com/localtunnel/localtunnel
docs: https://localtunnel.github.io/www/
detect:
  version_args:
  - --version
use_when:
- Sharing local development endpoints for instantaneous testing by remote agents
avoid_when:
- Mission-critical persistent production hosting
risk:
  level: medium
  effects:
  - network_access
  requires_auth: false
  destructive: false
  confirmation_required_for:
  - sharing local development endpoints publicly
