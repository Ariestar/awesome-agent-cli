name: sqldef
binary: sqldef
aliases: []
category:
- database
lang:
- all
summary: Idempotent database schema management CLI reconciling desired DDL with database
  state.
homepage: https://github.com/sqldef/sqldef
docs: https://github.com/sqldef/sqldef#readme
detect:
  version_args:
  - --version
use_when:
- Applying declarative schema definitions idempotently without step-by-step migration
  files
avoid_when:
- Complex data transformations requiring programmatic migration scripts
risk:
  level: medium
  effects:
  - network_access
  - write_files
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - executing generated alter statements
