name: helicone
binary: helicone
aliases: []
category:
- metrics
- network
lang:
- all
summary: Observability and caching proxy CLI for agent API traffic.
homepage: https://github.com/Helicone/helicone
docs: https://docs.helicone.ai
detect:
  version_args:
  - --version
use_when:
- Proxying agent LLM requests for caching, cost tracking, and rate limiting
avoid_when:
- Direct on-device inference without network hops
risk:
  level: low
  effects:
  - network_access
  requires_auth: true
  destructive: false
  confirmation_required_for: []
