name: deepeval
binary: deepeval
aliases: []
category:
- test
lang:
- python
summary: Production-grade unit testing and regression evaluation CLI for LLM agents.
homepage: https://github.com/confident-ai/deepeval
docs: https://docs.confident-ai.com
detect:
  version_args:
  - --version
use_when:
- Measuring hallucination, tool correctness, and answer relevance in CI pipelines
avoid_when:
- Traditional software unit testing without LLM outputs
risk:
  level: medium
  effects:
  - network_access
  - read_files
  requires_auth: false
  destructive: false
  confirmation_required_for:
  - sending test evaluation batches
