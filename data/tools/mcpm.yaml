name: mcpm
binary: mcpm
aliases: []
category:
- mcp
- package-manager
lang:
- all
summary: Lightweight MCP server package manager CLI for installing and configuring
  servers.
homepage: https://github.com/pathwaycom/mcpm
docs: https://github.com/pathwaycom/mcpm#readme
detect:
  version_args:
  - --version
use_when:
- Managing MCP servers across Claude Desktop, Zed, and other supported agent clients
avoid_when:
- Direct manual configuration editing
risk:
  level: medium
  effects:
  - write_files
  - network_access
  - install_packages
  requires_auth: false
  destructive: false
  confirmation_required_for:
  - registering servers in client config files
