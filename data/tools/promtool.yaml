name: promtool
binary: promtool
aliases: []
category:
- metrics
- test
lang:
- all
summary: Prometheus official CLI for validating alert rules, configs, and running
  metric unit tests.
homepage: https://github.com/prometheus/prometheus
docs: https://prometheus.io/docs/prometheus/latest/command-line/promtool/
detect:
  version_args:
  - --version
use_when:
- Linting Prometheus configuration files and executing unit tests for alert rules
avoid_when:
- Running live metrics scraping daemons
risk:
  level: low
  effects:
  - read_files
  requires_auth: false
  destructive: false
  confirmation_required_for: []
