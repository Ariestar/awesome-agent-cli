name: swarm-cli
binary: swarm
aliases: []
category:
- agent
lang:
- python
summary: Lightweight multi-agent orchestration CLI inspired by OpenAI Swarm.
homepage: https://github.com/openai/swarm
docs: https://github.com/openai/swarm#readme
detect:
  version_args:
  - --version
use_when:
- Orchestrating multi-agent handoffs with minimal abstraction and explicit function
  routing
avoid_when:
- Complex long-term persistent workflow states with database checkpointing
risk:
  level: medium
  effects:
  - network_access
  - execute_code
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - executing agent handoffs
