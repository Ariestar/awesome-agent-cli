name: codeforge
binary: codeforge
aliases: []
category:
- agent
lang:
- all
summary: Terminal-based autonomous coding agent with automated test loops and error
  recovery.
homepage: https://github.com/codeforge-ai
docs: https://github.com/codeforge-ai#readme
detect:
  version_args:
  - --version
use_when:
- Running test-driven development loops where the agent iteratively repairs failing
  assertions
avoid_when:
- Writing prose or non-testable configuration files
risk:
  level: high
  effects:
  - execute_code
  - write_files
  - network_access
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - running local test suites
guardrails:
- Review commands executed during automated test-and-repair loops.
