name: litecli
binary: litecli
aliases: []
category:
- database
lang:
- all
summary: SQLite CLI with auto-completion and syntax highlighting for terminal exploration.
homepage: https://github.com/dbcli/litecli
docs: https://litecli.com
detect:
  version_args:
  - --version
use_when:
- Browsing and querying local SQLite database files with autocompletion in console
avoid_when:
- Remote distributed database clusters
risk:
  level: low
  effects:
  - read_files
  - write_files
  requires_auth: false
  destructive: false
  confirmation_required_for: []
