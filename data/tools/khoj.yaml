name: khoj
binary: khoj
aliases: []
category:
- agent
- search
lang:
- all
summary: Personal AI agent CLI for searching local markdown, PDFs, repositories, and
  notes.
homepage: https://github.com/khoj-ai/khoj
docs: https://docs.khoj.dev
detect:
  version_args:
  - --version
use_when:
- Searching personal notes, Obsidian vaults, and technical documents with semantic
  search
avoid_when:
- Modifying code or pushing repository commits
risk:
  level: low
  effects:
  - read_files
  - network_access
  requires_auth: false
  destructive: false
  confirmation_required_for: []
