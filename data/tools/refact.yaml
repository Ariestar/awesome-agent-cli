name: refact
binary: refact
aliases: []
category:
- agent
lang:
- all
summary: Open-source AI code assistant and autonomous agent CLI for terminal-based
  completions.
homepage: https://github.com/smallcloudai/refact
docs: https://refact.ai
detect:
  version_args:
  - --version
use_when:
- Self-hosting fine-tuned coding models with autonomous tool-calling capabilities
avoid_when:
- Cloud-only workflows with strict vendor-hosted requirements
risk:
  level: high
  effects:
  - write_files
  - network_access
  - execute_code
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - accepting autonomous file rewrites
guardrails:
- Check code diffs before accepting modifications.
