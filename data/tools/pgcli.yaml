name: pgcli
binary: pgcli
aliases: []
category:
- database
lang:
- all
summary: PostgreSQL interactive terminal client with auto-completion and syntax highlighting.
homepage: https://github.com/dbcli/pgcli
docs: https://www.pgcli.com
detect:
  version_args:
  - --version
use_when:
- Interactively investigating PostgreSQL tables with schema-aware autocomplete
avoid_when:
- Headless non-interactive database batch migrations
risk:
  level: medium
  effects:
  - network_access
  - read_files
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - running update or delete queries
