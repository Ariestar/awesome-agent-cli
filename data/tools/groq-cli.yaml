name: groq-cli
binary: groq
aliases: []
category:
- network
- agent
lang:
- all
summary: CLI client for querying Groq ultra-low latency LPU inference endpoints.
homepage: https://groq.com
docs: https://console.groq.com/docs
detect:
  version_args:
  - --version
use_when:
- Running ultra-fast token generation benchmarks and API requests against Groq hardware
avoid_when:
- Self-hosted local offline models
risk:
  level: medium
  effects:
  - network_access
  - secret_exposure
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - managing API keys
