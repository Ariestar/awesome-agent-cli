name: appagent
binary: appagent
aliases: []
category:
- agent
- mobile
lang:
- python
summary: Multimodal agent CLI for smartphone and GUI automation via visual perception.
homepage: https://github.com/mnotgod96/AppAgent
docs: https://appagent-official.github.io
detect:
  version_args:
  - --version
use_when:
- Operating mobile apps through visual perception, tap gestures, and automated exploration
avoid_when:
- Pure backend CLI development
risk:
  level: high
  effects:
  - execute_code
  - network_access
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - triggering device touch events
guardrails:
- Confirm operations before executing UI actions on live devices.
