name: lazydocker
binary: lazydocker
aliases: []
category:
- container
- terminal
lang:
- all
summary: Terminal UI for managing Docker containers, compose stacks, images, and volumes.
homepage: https://github.com/jesseduffield/lazydocker
docs: https://github.com/jesseduffield/lazydocker#readme
detect:
  version_args:
  - --version
use_when:
- Managing containers, inspecting logs, and pruning unused Docker resources in terminal
avoid_when:
- Headless CI automation scripts
risk:
  level: medium
  effects:
  - container_mutation
  - read_processes
  requires_auth: false
  destructive: false
  confirmation_required_for:
  - pruning docker volumes or stopped containers
