name: tensorrt-llm
binary: trtllm-build
aliases: []
category:
- runtime
lang:
- all
summary: NVIDIA TensorRT-LLM CLI compiling and accelerating LLM inference graphs on
  GPUs.
homepage: https://github.com/NVIDIA/TensorRT-LLM
docs: https://nvidia.github.io/TensorRT-LLM/
detect:
  version_args:
  - --version
use_when:
- Compiling custom TensorRT engines to achieve absolute lowest token generation latency
avoid_when:
- Running non-NVIDIA CPU inference
risk:
  level: medium
  effects:
  - read_files
  - write_files
  requires_auth: false
  destructive: false
  confirmation_required_for:
  - building serialized engine models
