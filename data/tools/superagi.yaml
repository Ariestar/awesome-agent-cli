name: superagi
binary: superagi
aliases: []
category:
- agent
- infra
lang:
- python
summary: Infrastructure and CLI for creating, managing, and running autonomous agent
  jobs.
homepage: https://github.com/TransformerOptimus/SuperAGI
docs: https://superagi.com/docs/
detect:
  version_args:
  - --version
use_when:
- Running concurrent agent workflows with dedicated action consoles and tool telemetry
avoid_when:
- Simple localized terminal queries
risk:
  level: high
  effects:
  - execute_code
  - network_access
  - write_files
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - spawning persistent autonomous agent instances
guardrails:
- Confirm tool credentials before granting agent access.
