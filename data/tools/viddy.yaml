name: viddy
binary: viddy
aliases: []
category:
- terminal
lang:
- all
summary: Modern watch command replacement with diff highlighting and time machine
  output history.
homepage: https://github.com/sachaos/viddy
docs: https://github.com/sachaos/viddy#readme
detect:
  version_args:
  - --version
use_when:
- Watching shell command outputs periodically with visual diff highlighting and time
  travel
avoid_when:
- Single-shot command execution
risk:
  level: low
  effects:
  - execute_code
  requires_auth: false
  destructive: false
  confirmation_required_for: []
