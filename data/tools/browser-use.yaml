name: browser-use
binary: browser-use
aliases: []
category:
- agent
- automation
lang:
- python
summary: Autonomous browser automation agent CLI driven by vision and Playwright.
homepage: https://github.com/browser-use/browser-use
docs: https://docs.browser-use.com
detect:
  version_args:
  - --version
use_when:
- Navigating websites, filling complex forms, and extracting information with vision-guided
  Playwright
avoid_when:
- Static text parsing that does not require JavaScript execution or visual recognition
risk:
  level: high
  effects:
  - network_access
  - execute_code
  - secret_exposure
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - performing payments
  - submitting unreviewed web forms
guardrails:
- Prevent autonomous submission of banking or sensitive identity forms.
