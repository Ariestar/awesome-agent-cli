name: terminalgpt
binary: terminalgpt
aliases: []
category:
- agent
- shell
lang:
- all
summary: Interactive GPT chat and task automation directly in the console.
homepage: https://github.com/jucasoliveira/terminalgpt
docs: https://github.com/jucasoliveira/terminalgpt#readme
detect:
  version_args:
  - --version
use_when:
- Having conversational chat sessions inside the terminal emulator
avoid_when:
- Autonomous multi-file refactoring
risk:
  level: medium
  effects:
  - network_access
  - read_files
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - sending shell history to remote models
