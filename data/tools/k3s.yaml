name: k3s
binary: k3s
aliases: []
category:
- kubernetes
lang:
- all
summary: Lightweight certified Kubernetes distribution binary optimized for edge and
  dev setups.
homepage: https://github.com/k3s-io/k3s
docs: https://docs.k3s.io
detect:
  version_args:
  - --version
use_when:
- Deploying a production-compliant minimal Kubernetes server on single Linux machines
avoid_when:
- Managed hyperscaler Kubernetes clusters like EKS or GKE
risk:
  level: high
  effects:
  - execute_code
  - network_access
  - container_mutation
  requires_auth: false
  destructive: false
  confirmation_required_for:
  - installing or uninstalling system cluster services
guardrails:
- Verify target host node before running server initialization.
