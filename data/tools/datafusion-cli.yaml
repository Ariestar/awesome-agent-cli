name: datafusion-cli
binary: datafusion-cli
aliases: []
category:
- database
lang:
- all
summary: Apache Arrow DataFusion in-memory SQL query CLI for fast Parquet and CSV
  analysis.
homepage: https://github.com/apache/arrow-datafusion
docs: https://arrow.apache.org/datafusion/
detect:
  version_args:
  - --version
use_when:
- Executing fast SQL queries across massive columnar Parquet files on local disk
avoid_when:
- Transaction-heavy OLTP databases with row-level locking
risk:
  level: low
  effects:
  - read_files
  requires_auth: false
  destructive: false
  confirmation_required_for: []
