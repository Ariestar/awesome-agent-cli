name: mem0
binary: mem0
aliases: []
category:
- agent
- database
lang:
- python
summary: Personalized memory layer and CLI for autonomous agents and LLMs.
homepage: https://github.com/mem0ai/mem0
docs: https://docs.mem0.ai
detect:
  version_args:
  - --version
use_when:
- Persisting user preferences and facts across distinct agent sessions and tools
avoid_when:
- Stateless single-turn query execution
risk:
  level: medium
  effects:
  - network_access
  - read_files
  - write_files
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - wiping stored agent memory stores
