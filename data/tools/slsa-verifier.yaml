name: slsa-verifier
binary: slsa-verifier
aliases: []
category:
- security
lang:
- all
summary: CLI tool for verifying SLSA provenance attestation on software artifacts.
homepage: https://github.com/slsa-framework/slsa-verifier
docs: https://slsa.dev
detect:
  version_args:
  - --version
use_when:
- Validating that downloaded binaries or container images match cryptographic build
  provenance
avoid_when:
- Local untagged test binaries
risk:
  level: low
  effects:
  - read_files
  - network_access
  requires_auth: false
  destructive: false
  confirmation_required_for: []
