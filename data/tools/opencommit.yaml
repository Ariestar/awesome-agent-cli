name: opencommit
binary: opencommit
aliases: []
category:
- vcs
- agent
lang:
- all
summary: AI-powered git commit message generator CLI analyzing diffs with conventional
  formats.
homepage: https://github.com/di-sukharev/opencommit
docs: https://github.com/di-sukharev/opencommit#readme
detect:
  version_args:
  - --version
use_when:
- Generating conventional commit messages automatically from staged git diffs
avoid_when:
- Committing changes with pre-determined specific ticket keys
risk:
  level: medium
  effects:
  - read_files
  - vcs_mutation
  - network_access
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - creating git commits automatically
