name: steel
binary: steel
aliases: []
category:
- agent
- environment
lang:
- all
summary: Headless browser sandbox CLI engineered for AI agents.
homepage: https://github.com/steel-dev/steel-browser
docs: https://steel.dev/docs
detect:
  version_args:
  - --version
use_when:
- Spinning up isolated, anti-detect browser instances specifically for autonomous
