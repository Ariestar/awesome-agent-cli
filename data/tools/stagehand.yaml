name: stagehand
binary: stagehand
aliases: []
category:
- agent
- automation
lang:
- all
summary: Browserbase AI-first web automation agent CLI with natural language selectors.
homepage: https://github.com/browserbase/stagehand
docs: https://docs.stagehand.dev
detect:
  version_args:
  - --version
use_when:
- Automating web interactions using natural language action primitives like act, extract,
  and observe
avoid_when:
- Strict deterministic selectors that do not change over time
risk:
  level: high
  effects:
  - network_access
  - execute_code
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - submitting sensitive web transactions
guardrails:
- Review automation scripts before executing automated form actions.
