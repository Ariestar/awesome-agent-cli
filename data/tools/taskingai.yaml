name: taskingai
binary: taskingai
aliases: []
category:
- agent
- infra
lang:
- python
summary: Unified agent management and workflow execution CLI.
homepage: https://github.com/TaskingAI/TaskingAI
docs: https://docs.tasking.ai
detect:
