name: llama-factory
binary: llama-factory
aliases: []
category:
- runtime
- build
lang:
- python
summary: Unified efficient fine-tuning CLI supporting 100+ LLMs with WebUI and script
  execution.
homepage: https://github.com/hiyouga/LLaMA-Factory
docs: https://llamafactory.readthedocs.io
detect:
  version_args:
  - --version
use_when:
- Running parameter-efficient fine-tuning (LoRA, QLoRA) on popular open-source models
avoid_when:
- Inference-only client tasks
risk:
  level: medium
  effects:
  - read_files
  - write_files
  - execute_code
  requires_auth: false
  destructive: false
  confirmation_required_for:
  - overwriting saved checkpoint directories
