name: valgrind
binary: valgrind
aliases: []
category:
- debug
- test
lang:
- all
summary: Instrumentation framework for memory debugging, leak detection, and profiling.
homepage: https://www.valgrind.org
docs: https://valgrind.org/docs/manual/manual.html
detect:
  version_args:
  - --version
use_when:
- Detecting memory access bugs, use-after-free, and buffer overflows in compiled code
avoid_when:
- Profiling high-throughput production services with strict latency bounds
risk:
  level: medium
  effects:
  - execute_code
  requires_auth: false
  destructive: false
  confirmation_required_for:
  - running intensive simulated emulation runs
