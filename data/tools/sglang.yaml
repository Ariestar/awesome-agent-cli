name: sglang
binary: sglang
aliases: []
category:
- runtime
- infra
lang:
- python
summary: Structured Generation Language CLI providing high-speed inference for agent
  workflows.
homepage: https://github.com/sgl-project/sglang
docs: https://sgl-project.github.io
detect:
  version_args:
  - --version
use_when:
- Accelerating multi-call agent programs and constrained structured output generation
avoid_when:
- Simple single-prompt text generation
risk:
  level: medium
  effects:
  - read_files
  - network_access
  requires_auth: false
  destructive: false
  confirmation_required_for:
  - launching server instances
