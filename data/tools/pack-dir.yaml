name: pack-dir
binary: pack-dir
aliases: []
category:
- agent-context
lang:
- all
summary: Fast Rust CLI bundling directories into token-optimized XML and Markdown
  formats.
homepage: https://github.com/Ariestar/pack-dir
docs: https://github.com/Ariestar/pack-dir#readme
detect:
  version_args:
  - --version
use_when:
- Bundling large directories into formatted XML tags with ignore patterns
avoid_when:
- Reading a single file directly
risk:
  level: low
  effects:
  - read_files
  requires_auth: false
  destructive: false
  confirmation_required_for: []
