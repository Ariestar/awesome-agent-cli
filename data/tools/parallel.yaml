name: parallel
binary: parallel
aliases: []
category:
- automation
- shell
lang:
- all
summary: GNU Parallel CLI tool for executing batch shell commands across CPU cores
  in parallel.
homepage: https://www.gnu.org/software/parallel/
docs: https://www.gnu.org/software/parallel/
detect:
  version_args:
  - --version
use_when:
- Distributing thousands of command line arguments across available CPU cores
avoid_when:
- Sequential commands with strict state dependencies
risk:
  level: high
  effects:
  - execute_code
  requires_auth: false
  destructive: false
  confirmation_required_for:
  - running large unconstrained parallel job batches
guardrails:
- Limit job counts with -j flag when executing intensive tasks.
