name: smolagents
binary: smolagents
aliases: []
category:
- agent
lang:
- python
summary: Hugging Face lightweight agent library and CLI executing code-based agentic
  actions.
homepage: https://github.com/huggingface/smolagents
docs: https://huggingface.co/docs/smolagents/
detect:
  version_args:
  - --version
use_when:
- Running minimalist agents that write and execute pure Python code rather than JSON
  tool calls
avoid_when:
- Strict non-code environments where arbitrary Python execution is unsafe
risk:
  level: high
  effects:
  - execute_code
  - network_access
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - executing synthesized Python code blocks
guardrails:
- Run code execution tools in restricted sandboxes.
