name: jina-reader
binary: jina
aliases: []
category:
- agent-context
- docs
lang:
- all
summary: Reading and converting any URL into clean LLM-ready markdown via CLI.
homepage: https://github.com/jina-ai/reader
docs: https://jina.ai/reader/
detect:
  version_args:
  - --version
use_when:
- Fetching web articles or API docs in terminal as clean markdown for immediate prompt
  ingestion
avoid_when:
- Interacting with stateful web forms or complex SPAs
risk:
  level: low
  effects:
  - network_access
  requires_auth: false
  destructive: false
  confirmation_required_for: []
