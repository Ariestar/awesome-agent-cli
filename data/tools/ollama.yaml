name: ollama
binary: ollama
aliases: []
category:
- runtime
- agent
lang:
- all
summary: Local LLM runner CLI supporting tool calling, custom Modelfiles, and fast
  inference.
homepage: https://github.com/ollama/ollama
docs: https://github.com/ollama/ollama#readme
detect:
  version_args:
  - --version
  local:
    files:
    - Modelfile
use_when:
- Running open-source models locally with an OpenAI-compatible API and native tool
  support
avoid_when:
- Running massive frontier models exceeding local hardware VRAM
risk:
  level: medium
  effects:
  - read_files
  - write_files
  - network_access
  requires_auth: false
  destructive: false
  confirmation_required_for:
  - downloading large model weights
