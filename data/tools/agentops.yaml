name: agentops
binary: agentops
aliases: []
category:
- metrics
- debug
lang:
- python
summary: Observability, replay, and cost-tracking CLI for agent workflows.
homepage: https://github.com/AgentOps-AI/agentops
docs: https://docs.agentops.ai
detect:
  version_args:
  - --version
use_when:
- Tracking agent execution sessions, debugging tool call failures, and monitoring
  token spend
avoid_when:
- Simple scripts without complex agent loops
risk:
  level: low
  effects:
  - network_access
  requires_auth: true
  destructive: false
  confirmation_required_for: []
