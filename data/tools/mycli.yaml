name: mycli
binary: mycli
aliases: []
category:
- database
lang:
- all
summary: Terminal client for MySQL and MariaDB with auto-completion and syntax highlighting.
homepage: https://github.com/dbcli/mycli
docs: https://www.mycli.net
detect:
  version_args:
  - --version
use_when:
- Running interactive queries against MySQL servers with contextual autocompletion
avoid_when:
- Scripted automated deployment pipelines
risk:
  level: medium
  effects:
  - network_access
  - read_files
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - running mutating statements
