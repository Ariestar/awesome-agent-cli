name: mitmproxy
binary: mitmproxy
aliases: []
category:
- network
- debug
lang:
- all
summary: Interactive TLS-capable intercepting HTTP proxy for debugging network API
  traffic.
homepage: https://github.com/mitmproxy/mitmproxy
docs: https://docs.mitmproxy.org
detect:
  version_args:
  - --version
use_when:
- Intercepting, modifying, and replaying HTTP requests during agent web testing
avoid_when:
- Passive production traffic with strict zero-interception policies
risk:
  level: high
  effects:
  - network_access
  - read_processes
  - secret_exposure
  requires_auth: false
  destructive: false
  confirmation_required_for:
  - installing root CA certificates
guardrails:
- Never commit or leak intercepted authorization headers.
