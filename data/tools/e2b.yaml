name: e2b
binary: e2b
aliases: []
category:
- agent
- environment
lang:
- all
summary: Secure cloud sandboxes CLI for running code generated by AI agents safely.
homepage: https://github.com/e2b-dev/E2B
docs: https://e2b.dev/docs
detect:
  version_args:
  - --version
use_when:
- Executing untrusted Python, JS, or bash commands generated by LLMs in microVMs
avoid_when:
- Local trusted development without isolation
risk:
  level: high
  effects:
  - execute_code
  - network_access
  - container_mutation
  requires_auth: true
  destructive: false
  confirmation_required_for:
  - spawning paid sandbox environments
guardrails:
- Monitor execution time and terminate idling sandbox containers.
