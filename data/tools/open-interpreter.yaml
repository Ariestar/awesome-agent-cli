name: open-interpreter
binary: interpreter
aliases: []
category:
- agent
- shell
lang:
- all
summary: Natural language interface in the terminal executing Python, Bash, JavaScript,
  and OS-level operations.
homepage: https://github.com/OpenInterpreter/open-interpreter
docs: https://docs.openinterpreter.com
detect:
  version_args:
  - --version
use_when:
- Controlling the local computer and running arbitrary scripting tasks via conversation
avoid_when:
- Restricted environments where automated script execution is disallowed
risk:
  level: high
  effects:
  - execute_code
  - write_files
  - network_access
  - delete_files
  requires_auth: true
  destructive: true
  confirmation_required_for:
  - running shell commands
  - modifying system files
guardrails:
- Keep interactive confirmation enabled for command execution.
